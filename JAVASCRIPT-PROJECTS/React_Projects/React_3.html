<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Keith Heffington">
    <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <title>Document</title>
</head>
<body>
    <div id="JSX"></div>
    <script type="text/babel">
        class Greeting extends React.Component { // React.Component - is used to specify a class or function, class specifies a class
            render() { // render() - is used t ocreate a function in React
                return <h1>Hello, World!</h1> // return - returns information
            }
        }

        ReactDOM.render(<Greeting / >, document.getElementById('JSX'))
    </script>
</body>
</html>
